# Sector ETF Mapping — stock sector → benchmark ETF
# Used by residual feature computation for factor decomposition.
# Status: ACTIVE — used by feature_factory/residual.py and __init__.py
#
# Confidence rules for residual features:
#   - If sector ETF is in universe and data available: SECTOR_RESIDUAL_USED
#   - If sector ETF not in universe: MARKET_ONLY_RESIDUAL_USED (use SPY)
#   - If no benchmark at all: BLOCKED_RESIDUAL_NAN_RATE
#   - If rolling R2 < min_r2_threshold: LOW_CONFIDENCE

min_r2_threshold: 0.2

sectors:
  technology:
    etf: XLK
    stocks: [AAPL, MSFT, GOOGL, META, AMZN, NFLX, CRM, ADBE, NOW, ORCL,
             AMD, NVDA, AVGO, QCOM, MU, TSM, ASML, ARM, MRVL, ON,
             DDOG, SNOW, PLTR, CRWD, NET, WOLF]
  semiconductors:
    etf: XLK
    stocks: [AMD, NVDA, AVGO, QCOM, MU, TSM, ASML, ARM, MRVL, ON]
  large_cap_tech:
    etf: XLK
    stocks: [AAPL, MSFT, GOOGL, META, AMZN, NFLX, CRM, ADBE, NOW, ORCL]
  quantum:
    etf: XLK
    stocks: [IONQ, RGTI, QBTS, ARQQ]

  finance:
