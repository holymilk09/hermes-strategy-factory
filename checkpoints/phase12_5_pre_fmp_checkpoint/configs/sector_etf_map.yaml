    stocks: [JPM, GS, MS, BAC, WFC, AXP, BLK, SCHW, C, V]
  large_cap_finance:
    etf: XLF
    stocks: [JPM, GS, MS, BAC, WFC, AXP, BLK, SCHW, C, V]

  healthcare:
