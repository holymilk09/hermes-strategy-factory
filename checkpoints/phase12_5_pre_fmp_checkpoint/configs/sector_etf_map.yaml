    etf: XLY
    stocks: [COST, WMT, HD, MCD, SBUX, NKE, TGT, LOW, TJX, DG]

  energy:
    etf: XLE
  materials:
    etf: XLB
    stocks: [FSLR, ENPH, SEDG, RUN, ALB, LAC]
  metals:
    etf: XLB
    stocks: [FSLR, ENPH, SEDG, RUN, ALB, LAC]

  real_estate:
