features:
  sma_5:
    category: technical
    subcategory: moving_average
    formula: mean(close[t-4:t+1])
    input_data:
    - close
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 5 bars available
    version: 1.0.0
    expected_use: short-term trend anchor, pullback reference
    risk_notes: "lagging \u2014 do not use for entry timing; use as fair-value anchor"
  sma_10:
    category: technical
    subcategory: moving_average
    formula: mean(close[t-9:t+1])
    input_data:
    - close
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 10 bars available
    version: 1.0.0
    expected_use: short-term trend
    risk_notes: lagging
  sma_20:
    category: technical
    subcategory: moving_average
    formula: mean(close[t-19:t+1])
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 20 bars available
    version: 1.0.0
    expected_use: intermediate trend, BB centerline
    risk_notes: common retail anchor; pair with residual for professional use
  sma_50:
    category: technical
    subcategory: moving_average
    formula: mean(close[t-49:t+1])
    input_data:
    - close
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 50 bars available
    version: 1.0.0
    expected_use: trend filter, regime anchor
    risk_notes: significant lag in fast-moving markets
  sma_200:
    category: technical
    subcategory: moving_average
    formula: mean(close[t-199:t+1])
    input_data:
    - close
    lookback: 200
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 200 bars available
    version: 1.0.0
    expected_use: long-term trend anchor, regime filter
    risk_notes: very lagging; fails during rapid regime changes (Q1 2025 selloff)
  dist_sma_5:
    category: technical
    subcategory: moving_average_distance
    formula: (close[t] - sma_5[t]) / sma_5[t]
    input_data:
    - close
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 5 bars available
    version: 1.0.0
    expected_use: short-term stretch from fair value
    risk_notes: raw-price-based; does not account for sector/regime movement
  dist_sma_10:
    category: technical
    subcategory: moving_average_distance
    formula: (close[t] - sma_10[t]) / sma_10[t]
    input_data:
    - close
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 10 bars available
    version: 1.0.0
    expected_use: pullback depth
    risk_notes: raw-price-based
  dist_sma_20:
    category: technical
    subcategory: moving_average_distance
    formula: (close[t] - sma_20[t]) / sma_20[t]
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 20 bars available
    version: 1.0.0
    expected_use: mean-reversion stretch from 20-day fair value
    risk_notes: raw-price-based
  dist_sma_50:
    category: technical
    subcategory: moving_average_distance
    formula: (close[t] - sma_50[t]) / sma_50[t]
    input_data:
    - close
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 50 bars available
    version: 1.0.0
    expected_use: medium-term dislocation
    risk_notes: raw-price-based
  dist_sma_200:
    category: technical
    subcategory: moving_average_distance
    formula: (close[t] - sma_200[t]) / sma_200[t]
    input_data:
    - close
    lookback: 200
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 200 bars available
    version: 1.0.0
    expected_use: long-term dislocation; crash filter
    risk_notes: raw-price-based; significant lag
  sma_5_slope:
    category: technical
    subcategory: moving_average_slope
    formula: (sma_5[t] - sma_5[t-5]) / sma_5[t-5]
    input_data:
    - close
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 10 bars available
    version: 1.0.0
    expected_use: trend acceleration detection
    risk_notes: lagging derivative of lagging indicator
  sma_10_slope:
    category: technical
    subcategory: moving_average_slope
    formula: (sma_10[t] - sma_10[t-5]) / sma_10[t-5]
    input_data:
    - close
    lookback: 15
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 15 bars available
    version: 1.0.0
    expected_use: trend strength
    risk_notes: derivative of lagging
  sma_20_slope:
    category: technical
    subcategory: moving_average_slope
    formula: (sma_20[t] - sma_20[t-5]) / sma_20[t-5]
    input_data:
    - close
    lookback: 25
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 25 bars available
    version: 1.0.0
    expected_use: trend direction confirmation
    risk_notes: derivative of lagging
  sma_50_slope:
    category: technical
    subcategory: moving_average_slope
    formula: (sma_50[t] - sma_50[t-5]) / sma_50[t-5]
    input_data:
    - close
    lookback: 55
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 55 bars available
    version: 1.0.0
    expected_use: medium-term trend strength
    risk_notes: very lagging
  sma_200_slope:
    category: technical
    subcategory: moving_average_slope
    formula: (sma_200[t] - sma_200[t-5]) / sma_200[t-5]
    input_data:
    - close
    lookback: 205
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: fill NaN until 205 bars available
    version: 1.0.0
    expected_use: secular trend direction
    risk_notes: extremely lagging; useless for timing
  ema_10:
    category: technical
    subcategory: exponential_moving_average
    formula: alpha * close[t] + (1-alpha) * ema[t-1]; alpha=2/11
    input_data:
    - close
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: seed with SMA(10), NaN until 10 bars
    version: 1.0.0
    expected_use: faster trend anchor than SMA
    risk_notes: "recursive \u2014 errors propagate"
  ema_20:
    category: technical
    subcategory: exponential_moving_average
    formula: alpha * close[t] + (1-alpha) * ema[t-1]; alpha=2/21
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: seed with SMA(20), NaN until 20 bars
    version: 1.0.0
    expected_use: trend pullback reference
    risk_notes: recursive
  ema_cross:
    category: technical
    subcategory: moving_average_crossover
    formula: (ema_10[t] - ema_20[t]) / ema_20[t]
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until both EMAs available
    version: 1.0.0
    expected_use: trend direction signal
    risk_notes: whipsaws in sideways markets
  rsi_2:
    category: technical
    subcategory: momentum_oscillator
    formula: 100 - 100/(1+avg_gain_2/avg_loss_2); Wilder smoothing
    input_data:
    - close
    lookback: 2
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 3 bars available
    version: 1.0.0
    expected_use: short-term mean-reversion entry signal
    risk_notes: rank-based; does not normalize for vol or regime; cited as cookie-cutter
      in Pillar 19
  rsi_7:
    category: technical
    subcategory: momentum_oscillator
    formula: 100 - 100/(1+avg_gain_7/avg_loss_7); Wilder smoothing
    input_data:
    - close
    lookback: 7
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 8 bars available
    version: 1.0.0
    expected_use: medium-term overbought/oversold
    risk_notes: less noisy than RSI(2) but slower to signal
  rsi_14:
    category: technical
    subcategory: momentum_oscillator
    formula: 100 - 100/(1+avg_gain_14/avg_loss_14); Wilder smoothing
    input_data:
    - close
    lookback: 14
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 15 bars available
    version: 1.0.0
    expected_use: standard oscillator; regime context
    risk_notes: classic RSI; overbought/oversold thresholds need regime adjustment
  bb_upper:
    category: technical
    subcategory: volatility_envelope
    formula: sma_20[t] + 2.0 * std_20[t]
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: overbought boundary; breakout confirmation
    risk_notes: assumes normal distribution; 2 std captures ~95% in theory, less in
      fat-tailed markets
  bb_lower:
    category: technical
    subcategory: volatility_envelope
    formula: sma_20[t] - 2.0 * std_20[t]
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: oversold boundary; mean-reversion trigger
    risk_notes: cookie-cutter signal; combine with residual z for edge
  bb_width:
    category: technical
    subcategory: volatility_envelope
    formula: (bb_upper[t] - bb_lower[t]) / sma_20[t]
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: volatility expansion/contraction signal
    risk_notes: narrowing bands precede expansion but direction unknown
  bb_position:
    category: technical
    subcategory: volatility_envelope
    formula: (close[t] - bb_lower[t]) / (bb_upper[t] - bb_lower[t])
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: normalized position within volatility envelope
    risk_notes: 0 = at lower band, 1 = at upper band; RANGE-BASED not vol-normalized
  atr_7:
    category: technical
    subcategory: volatility_measure
    formula: Wilder-smoothed true range over 7 periods
    input_data:
    - high
    - low
    - close
    lookback: 7
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 8 bars
    version: 1.0.0
    expected_use: short-term volatility, stop placement
    risk_notes: absolute dollar measure; not comparable across stocks without normalization
  atr_7_pct:
    category: technical
    subcategory: volatility_measure
    formula: atr_7[t] / close[t]
    input_data:
    - high
    - low
    - close
    lookback: 7
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 8 bars
    version: 1.0.0
    expected_use: normalized volatility for cross-asset comparison
    risk_notes: vol-normalized; more useful than raw ATR
  atr_14:
    category: technical
    subcategory: volatility_measure
    formula: Wilder-smoothed true range over 14 periods
    input_data:
    - high
    - low
    - close
    lookback: 14
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 15 bars
    version: 1.0.0
    expected_use: standard volatility; stop multiplier base
    risk_notes: standard; combine with regime filter
  atr_14_pct:
    category: technical
    subcategory: volatility_measure
    formula: atr_14[t] / close[t]
    input_data:
    - high
    - low
    - close
    lookback: 14
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 15 bars
    version: 1.0.0
    expected_use: cross-asset volatility ranking
    risk_notes: pct-based; good for filtering
  vol_ma_5:
    category: technical
    subcategory: volume
    formula: mean(volume[t-4:t+1])
    input_data:
    - volume
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 5 bars
    version: 1.0.0
    expected_use: baseline volume
    risk_notes: crude; better to normalize vs sector
  vol_ma_10:
    category: technical
    subcategory: volume
    formula: mean(volume[t-9:t+1])
    input_data:
    - volume
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 10 bars
    version: 1.0.0
    expected_use: volume baseline
    risk_notes: crude
  vol_ma_20:
    category: technical
    subcategory: volume
    formula: mean(volume[t-19:t+1])
    input_data:
    - volume
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: standard volume baseline
    risk_notes: monthly average volume
  vol_ma_50:
    category: technical
    subcategory: volume
    formula: mean(volume[t-49:t+1])
    input_data:
    - volume
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
    version: 1.0.0
    expected_use: long-term volume baseline
    risk_notes: slow to adapt
  vol_ma_200:
    category: technical
    subcategory: volume
    formula: mean(volume[t-199:t+1])
    input_data:
    - volume
    lookback: 200
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 200 bars
    version: 1.0.0
    expected_use: secular volume baseline
    risk_notes: very slow
  rvol_5:
    category: technical
    subcategory: relative_volume
    formula: volume[t] / vol_ma_5[t]
    input_data:
    - volume
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 5 bars
    version: 1.0.0
    expected_use: very short-term volume spike
    risk_notes: noisy on 5-day window
  rvol_10:
    category: technical
    subcategory: relative_volume
    formula: volume[t] / vol_ma_10[t]
    input_data:
    - volume
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 10 bars
    version: 1.0.0
    expected_use: short-term volume anomaly
    risk_notes: moderate noise
  rvol_20:
    category: technical
    subcategory: relative_volume
    formula: volume[t] / vol_ma_20[t]
    input_data:
    - volume
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: volume climax detection; rvol > 1.5 = significant
    risk_notes: standard relative volume
  rvol_50:
    category: technical
    subcategory: relative_volume
    formula: volume[t] / vol_ma_50[t]
    input_data:
    - volume
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
    version: 1.0.0
    expected_use: volume anomaly vs quarterly average
    risk_notes: slow baseline
  rvol_200:
    category: technical
    subcategory: relative_volume
    formula: volume[t] / vol_ma_200[t]
    input_data:
    - volume
    lookback: 200
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 200 bars
    version: 1.0.0
    expected_use: volume anomaly vs annual average
    risk_notes: very slow baseline
  macd:
    category: technical
    subcategory: momentum_oscillator
    formula: ema(close,12) - ema(close,26)
    input_data:
    - close
    lookback: 26
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 26 bars
    version: 1.0.0
    expected_use: trend following; divergence
    risk_notes: classic indicator; lagging crossover
  macd_signal:
    category: technical
    subcategory: momentum_oscillator
    formula: ema(macd_line, 9)
    input_data:
    - close
    lookback: 35
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 35 bars
    version: 1.0.0
    expected_use: MACD signal line for crossover
    risk_notes: derivative of derivative; significant lag
  macd_histogram:
    category: technical
    subcategory: momentum_oscillator
    formula: macd[t] - macd_signal[t]
    input_data:
    - close
    lookback: 35
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 35 bars
    version: 1.0.0
    expected_use: momentum acceleration/deceleration
    risk_notes: popular but heavily exploited; use as context, not trigger
  swing_low_5d:
    category: technical
    subcategory: support_resistance
    formula: min(low[t-4:t+1])
    input_data:
    - low
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 5 bars
    version: 1.0.0
    expected_use: structural stop placement
    risk_notes: used for sweep detection and stop anchoring
  swing_high_5d:
    category: technical
    subcategory: support_resistance
    formula: max(high[t-4:t+1])
    input_data:
    - high
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 5 bars
    version: 1.0.0
    expected_use: resistance level; breakout reference
    risk_notes: basic reference level
  donchian_high_20:
    category: technical
    subcategory: donchian_channel
    formula: max(high[t-19:t+1])
    input_data:
    - high
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: breakout level (Turtle-style)
    risk_notes: entry/exit reference; raw price level
  donchian_low_20:
    category: technical
    subcategory: donchian_channel
    formula: min(low[t-19:t+1])
    input_data:
    - low
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: trailing stop reference
    risk_notes: raw price level
  donchian_pos_20:
    category: technical
    subcategory: donchian_channel
    formula: (close[t] - donchian_low_20[t]) / (donchian_high_20[t] - donchian_low_20[t])
    input_data:
    - high
    - low
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: position within 20-day range
    risk_notes: 0 = at 20d low; 1 = at 20d high
  donchian_high_50:
    category: technical
    subcategory: donchian_channel
    formula: max(high[t-49:t+1])
    input_data:
    - high
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
    version: 1.0.0
    expected_use: medium-term breakout
    risk_notes: raw price level
  donchian_low_50:
    category: technical
    subcategory: donchian_channel
    formula: min(low[t-49:t+1])
    input_data:
    - low
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
    version: 1.0.0
    expected_use: medium-term support
    risk_notes: raw price level
  donchian_pos_50:
    category: technical
    subcategory: donchian_channel
    formula: (close[t] - donchian_low_50[t]) / (donchian_high_50[t] - donchian_low_50[t])
    input_data:
    - high
    - low
    - close
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
    version: 1.0.0
    expected_use: position within quarterly range
    risk_notes: 0 = at 50d low; 1 = at 50d high
  hurst_100:
    category: technical
    subcategory: fractal
    formula: rescaled range analysis on log returns; H < 0.5 = mean-reverting
    input_data:
    - close
    lookback: 100
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 100 bars; return 0.5 (random walk) if insufficient data
    version: 1.0.0
    expected_use: structural mean-reversion filter
    risk_notes: R/S method has known bias; use as directional filter only, not precision
      tool
  mom_5d:
    category: statistical
    subcategory: momentum
    formula: close[t] / close[t-5] - 1
    input_data:
    - close
    lookback: 5
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 5 bars
    version: 1.0.0
    expected_use: 1-week momentum
    risk_notes: short horizon; noisy on daily bars
  mom_10d:
    category: statistical
    subcategory: momentum
    formula: close[t] / close[t-10] - 1
    input_data:
    - close
    lookback: 10
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 10 bars
    version: 1.0.0
    expected_use: 2-week momentum
    risk_notes: short-term trend
  mom_20d:
    category: statistical
    subcategory: momentum
    formula: close[t] / close[t-20] - 1
    input_data:
    - close
    lookback: 20
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 20 bars
    version: 1.0.0
    expected_use: 1-month momentum
    risk_notes: standard momentum factor
  mom_50d:
    category: statistical
    subcategory: momentum
    formula: close[t] / close[t-50] - 1
    input_data:
    - close
    lookback: 50
    known_at_time: end of bar t
    lag_required: 0
    point_in_time_safe: true
    missing_policy: NaN until 50 bars
